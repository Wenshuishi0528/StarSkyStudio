name: Publish StarSky web app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check sky, rendering and export logic
        run: |
          node astro.test.cjs
          node universe.test.cjs
          node galaxy.test.cjs
          node star-chart.test.cjs
          node i18n.test.cjs
          node app.test.cjs
          node web-export.test.cjs
          node web-app.test.cjs
      - name: Build and verify the static site
        run: node web-build.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
